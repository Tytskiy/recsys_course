[project]
name = "engine_server"
version = "0.1.0"
description = "Toy RecSys microservice"
readme = "README.md"
requires-python = "==3.13.5"
dependencies = [
    "engine",
    "fastapi>=0.116.1",
    "uvicorn>=0.38.0",
]

[tool.uv]
package = false

[tool.uv.sources]
engine = { path = "../engine", editable = true }

[dependency-groups]
dev = [
    "fakeredis[valkey]>=2.32.0",
    "pytest>=8.4.1",
    "ruff>=0.12.10",
    "httpx>=0.27.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = ["test_*.py"]
