[project]
name = "experiments_server"
version = "0.1.0"
description = "Experiment management service for recommender configuration."
readme = "README.md"
requires-python = "==3.13.5"
dependencies = [
    "fastapi>=0.116.1",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.38.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.12.10",
    "httpx>=0.28.1",
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
