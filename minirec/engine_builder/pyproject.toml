[project]
name = "engine-builder"
version = "0.1.0"
description = "Toy Recommender System offline data builder"
readme = "README.md"
requires-python = "==3.13.5"
dependencies = [
    "catboost>=1.2.8",
    "implicit>=0.7.2",
    "polars>=1.32.3",
    "boto3>=1.42.5",
    "pyarrow>=22.0.0",
    "click>=8.3.1",
    "loguru>=0.7.3",
    "fastslim>=0.1.3",
    "torch>=2.10.0",
    "transformers>=5.2.0",
    "numba>=0.64.0",
    "engine",
]

[tool.uv.sources]
engine = { path = "../engine", editable = true }

[dependency-groups]
dev = [
    "joblib>=1.5.1",
    "scikit-learn>=1.8.0",
    "pytest>=8.4.1",
    "ruff>=0.12.10",
    "testcontainers>=4.8.1",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = ["test_*.py"]
filterwarnings = ["ignore:Method expects CSR input"]

# See engine/pyproject.toml: scoped to the source tree.
[tool.coverage.run]
source = ["tasks"]
