[project]
name = "engine-downloader"
version = "0.1.0"
description = "Sidecar utilities for downloading recommender archives"
requires-python = "==3.13.5"
dependencies = [
    "boto3>=1.42.5",
    "click>=8.1.8",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "moto[s3]>=5.0.0",
    "pytest>=8.4.1",
    "ruff>=0.12.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
