[project]
name = "minirec"
version = "0.1.0"
requires-python = "==3.13.5"
dependencies = [
    "boto3>=1.42.5",
    "click>=8.1.8",
    "fastapi>=0.116.1",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.38.0",
    "pytest>=8.4.2",
    "httpx>=0.28.1",
    "engine",
    "fakeredis[valkey]>=2.34.0",
    "ruff>=0.15.1",
    "joblib>=1.5.3",
    "numpy>=2.4.2",
    "moto[s3]>=5.1.21",
    "catboost>=1.2.10",
    "implicit>=0.7.2",
    "polars>=1.38.1",
    "loguru>=0.7.3",
    "fastslim>=0.1.3",
    "torch>=2.10.0",
    "transformers>=5.2.0",
    "pyarrow>=23.0.1",
    "scikit-learn>=1.8.0",
    "numba>=0.64.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
python_files = ["test_*.py"]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "engine",
]

[tool.uv.sources]
engine = { workspace = true }
